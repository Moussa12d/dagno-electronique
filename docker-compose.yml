services:
  postgres:
    image: postgres:16-alpine
    container_name: dagno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dagno
      POSTGRES_PASSWORD: dagno_dev_password
      POSTGRES_DB: dagno_electronique
      TZ: Africa/Bamako
    ports:
      - "5433:5432"
    volumes:
      - dagno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagno -d dagno_electronique"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: dagno_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dagno_pgdata:
  