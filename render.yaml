  - type: web
    name: dagno-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dagno-backend.onrender.com/api/v1
      - key: VITE_UPLOADS_URL
        value: ""